<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAG Admin | Secure Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap-grid.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/CSS/style.css">
    <style>
        body { 
            background: radial-gradient(circle at top right, #1a1a2e, #0a0a12); 
            min-height: 100vh; 
        }
        .login-card { border: none; border-radius: 1.5rem; box-shadow: 0 1rem 3rem rgba(0,0,0,0.5); }
        .btn-primary { background: #d4af37; border: none; font-weight: 600; padding: 12px; color: #0a192f; }
        .btn-primary:hover { background: #f1c40f; color: #0a192f; }
        .form-control { border-radius: 0.75rem; padding: 0.75rem 1rem; }
    </style>
    <link rel="stylesheet" href="/CSS/site-pages.css">
    <link rel="icon" type="image/svg+xml" href="/assets/kag-maridadi-logo.svg">
</head>
<body class="portal-page">
    <div class="container d-flex justify-content-center">
        <div class="card login-card portal-card p-4 bg-white text-dark shadow-lg">
            <img class="portal-logo" src="/assets/kag-maridadi-logo.svg" alt="KAG Maridadi crest"><h3 class="text-center portal-brand">KAG Maridadi</h3>
            <p class="portal-brand-subtitle text-center small">Administration</p>
            <p class="text-center text-muted">Authorized Personnel Only</p>
            <form id="loginForm">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" id="user" class="form-control" placeholder="admin" required>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" id="pass" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Unlock Dashboard</button>
                <div class="mt-3 text-center">
                    <a href="#" onclick="forgotPassword()" class="small text-decoration-none">Forgot Password?</a>
                    <hr>
                    <p class="small mb-0">Don't have an account? <a href="register.html" class="text-decoration-none">Sign Up</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Check if the user just logged out
        if (new URLSearchParams(window.location.search).get('logout') === 'success') {
            if (!confirm("Administrator has logged out successfully. Would you like to log in again?")) {
                window.location.href = '../index.html'; // Redirect to home if they cancel
            }
        }

        function forgotPassword() {
            alert("For security reasons, hardcoded admin credentials must be recovered via the source code or by contacting the system developer.");
        }

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const username = document.getElementById('user').value;
            const password = document.getElementById('pass').value;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Verifying...';

            try {
                // Call the Backend Login API
                const baseUrl = window.location.origin;

                const res = await fetch(`${baseUrl}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    // Standardize token naming
                    localStorage.setItem('kag_token', data.token);
                    localStorage.setItem('kag_role', 'Admin');
                    window.location.href = 'dashboard.html';
                } else {
                    const error = await res.json();
                    alert("Access Denied: " + (error.message || "Incorrect credentials."));
                }
            } catch (err) {
                console.error("Connection error:", err);
                alert("Could not reach the backend. Is it running on port 3000?");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Unlock Dashboard';
            }
        };
    </script>
</body>
</html>
