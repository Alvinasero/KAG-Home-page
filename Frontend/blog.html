    <section class="section-space">
        <div class="container">
            <h3 class="text-gold fw-bold mb-3">KAG MARIDADI</h3>
            <div class="footer-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="about.html#leadership">Leadership</a><a href="departments.html">Departments</a><a href="events.html">Events</a><a href="sermons.html">Education</a><a href="about.html#beliefs">Credentials</a><a href="gallery.html">Gallery</a><a href="contact.html">Contact</a></div>

        </div>

    <script>
        async function fetchBlog() {
            const container = document.getElementById('blogContainer');
            const baseUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000' : '';

            try {
                const res = await fetch(`${baseUrl}/api/blog`);
                const posts = await res.json();
                container.innerHTML = '';

                window.blogPosts = posts;
                posts.forEach(post => {
                    container.innerHTML += `
                        <div class="col-12 col-md-6 col-xl-4">
                            <div class="card kag-card h-100">
                                <img src="${imgSrc}" class="card-img-top blog-post-img" alt="News image">
                                <div class="card-body p-4">
                                    <span class="badge bg-light text-dark mb-3">${post.category || 'Church News'}</span>
                                    <h5 class="fw-bold">${post.title}</h5>
                                    <p class="text-muted small">${post.content.substring(0, 120)}...</p>
                                    <button type="button" class="btn btn-gold btn-sm" onclick="showPost('${post._id}')">Read More</button>
                                </div>
                                <div class="card-footer bg-white border-0 text-muted small px-4 pb-4">
                                    Published: ${new Date(post.published_at).toLocaleDateString()}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                container.innerHTML = '<div class="col-12 empty-state">No news available.</div>';
            }
        }
        function showPost(id) {
            const post = (window.blogPosts || []).find(item => item._id === id);
            if (!post) return;
            const modal = document.createElement('dialog');
            modal.className = 'blog-dialog';
            const title = document.createElement('h2');
            title.textContent = post.title || 'Church update';
            const content = document.createElement('p');
            content.textContent = post.content || '';
            const close = document.createElement('button');
            close.className = 'btn btn-gold';
            close.textContent = 'Close';
            close.addEventListener('click', () => modal.close());
            modal.append(title, content, close);
            modal.addEventListener('close', () => modal.remove(), { once: true });
            document.body.append(modal);
            modal.showModal();
        }
        window.onload = fetchBlog;
    </script>
    <script src="js/site.js"></script>
</body>
</html>
